name: mediatek-daily

on:
  schedule:
    # GitHub cron 使用 UTC。台北 06:07 與 06:37(備援) = UTC 前一天 22:07 / 22:37，
    # 所以星期要用 日~四(0-4)，對應台北的 週一~週五；避開整點尖峰
    - cron: "7 22 * * 0-4"
    - cron: "37 22 * * 0-4"
  workflow_dispatch:
    inputs:
      backfill:
        description: "一次回補幾天的三大法人資料(首次建議 250)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: mediatek-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mediatek_daily.py --backfill "${{ github.event.inputs.backfill || '0' }}" --mode "${{ github.event_name == 'schedule' && 'scheduled' || 'live' }}"

      - name: Commit reports and caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data docs
          git diff --cached --quiet || git commit -m "daily report $(TZ=Asia/Taipei date +%F)"
          git push
